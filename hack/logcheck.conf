# Per-file overrides for hack/verify-structured-logging.sh.
#
# All logcheck checks enabled by default (structured, parameters, key,
# verbosity-zero, verbosity-error, deprecations) apply to every file.
# Each line below has the form:
#
#   [-]<check>[,<check>...] <regular expression>
#
# The regular expression is matched against <package path>/<file name>, for
# example sigs.k8s.io/cluster-autoscaler/pkg/core/static_autoscaler.go.
# A leading "-" disables the check(s) for matching files, no prefix enables
# them. Later lines override earlier ones.
#
# Example: allow unstructured klog calls in a package that isn't migrated yet:
#
#   -structured sigs.k8s.io/cluster-autoscaler/pkg/foo/.*

# KWOK code is exempt from the structured logging requirement.
-structured sigs.k8s.io/cluster-autoscaler/kwok/.*
-structured sigs.k8s.io/cluster-autoscaler/pkg/cloudprovider/kwok/.*

# klogx wraps klog's unstructured functions (Infof, Warningf, ...) to add log quotas.
-structured sigs.k8s.io/cluster-autoscaler/pkg/utils/klogx/klogx.go
