name: Cluster Autoscaler E2E (kwok)
on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'kind-config.yaml'
      - 'tools/**'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'kind-config.yaml'
      - 'tools/**'

permissions:
  contents: read
  checks: write

jobs:
  e2e:
    name: CA E2E (kwok)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: make run-e2e
