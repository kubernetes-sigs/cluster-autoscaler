name: Verify Go

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'hack/**'
      - 'tools/**'
      - '.golangci.yml'
      - 'Makefile'
      - '.github/workflows/verify.yaml'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'hack/**'
      - 'tools/**'
      - '.golangci.yml'
      - 'Makefile'
      - '.github/workflows/verify.yaml'

permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Apt-get
        run: sudo apt-get install libseccomp-dev -qq

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Prepare
        run: hack/install-verify-tools.sh
        env:
          GO111MODULE: auto

      - name: Verify
        run: hack/verify-all.sh -v
        env:
          GO111MODULE: auto